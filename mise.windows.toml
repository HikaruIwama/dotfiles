[dotfiles]
"~/.wslconfig" = "wsl/.wslconfig"
"~/.wezterm.lua" = "wezterm/wezterm.lua"
"~/AppData/Local/nvim" = "nvim"
"~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = "powershell/Microsoft.PowerShell_profile.ps1"

[bootstrap.hooks.pre-dotfiles]
run = "pwsh -NoProfile -File scripts/ensure-dotfile-links.ps1"

[bootstrap.hooks.post-dotfiles]
run = [
  "pwsh -NoProfile -File scripts/ensure-dotfile-links.ps1 -Verify",
  "pwsh -NoProfile -File scripts/install-plemoljp.ps1",
]

[tasks.bootstrap]
run = "pwsh -NoProfile -File scripts/add-mise-shims-to-path.ps1"
