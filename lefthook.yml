pre-commit:
  jobs:
    - name: check-secrets
      run: mise run check-secrets

pre-push:
  jobs:
    - name: check-format-lua
      run: mise run check-format-lua
    - name: lint-lua
      run: mise run lint-lua
    - name: check-format-sh
      glob: "*.sh"
      run: mise run check-format-sh
    - name: lint-sh
      glob: "*.sh"
      run: mise run lint-sh
