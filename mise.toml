min_version = "2026.9.5"

[tools]
"aqua:JohnnyMorganz/StyLua" = "2.6.0"
"aqua:LuaLS/lua-language-server" = "3.19.2"
"aqua:betterleaks/betterleaks" = "1.9.0"
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"

[settings]
experimental = true
dotfiles.root = "."

[bootstrap.hooks.post-tools]
run = [
  "mise exec -- playwright install chromium",
  "mise exec -- lefthook install",
  "mise exec -- node scripts/update-external-skills.mjs",
]

[tasks.format-lua]
run = "stylua --allow-hidden ."

[tasks.check-format-lua]
run = "stylua --allow-hidden --check ."

[tasks.lint-lua]
run = 'lua-language-server --check=. --configpath=.luarc.json --check_format=pretty --logpath="{{ xdg_cache_home }}/lua-language-server/dotfiles/log" --metapath="{{ xdg_cache_home }}/lua-language-server/dotfiles/meta"'
run_windows = 'lua-language-server --check_worker=. --configpath=.luarc.json --check_format=pretty --logpath="{{ xdg_cache_home }}/lua-language-server/dotfiles/log" --metapath="{{ xdg_cache_home }}/lua-language-server/dotfiles/meta"'

[tasks.format-sh]
run = "shfmt --write ."

[tasks.check-format-sh]
run = "shfmt --diff ."

# cmd on Windows does not expand globs, so list the scripts explicitly.
[tasks.lint-sh]
run = "shellcheck install.sh scripts/setup-docker-linux.sh"

[tasks.check-secrets]
run = "betterleaks git --pre-commit --redact --staged --verbose"

[tasks.test-mjs]
run = "node --test"

[tasks.install-external-skills]
run = "node scripts/install-external-skills.mjs"

[dotfiles]
"~/.agents/AGENTS.md" = "agents/AGENTS.md"
"~/.agents/.skill-lock.json" = "agents/.skill-lock.json"
"~/.agents/skills/*" = "agents/skills/*"
"~/.gitconfig" = "git/.gitconfig"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/mise/config.toml" = "mise/config.toml"
"~/.playwright/cli.config.json" = "playwright/cli.config.json"
"~/.claude/CLAUDE.md" = "agents/AGENTS.md"
"~/.claude/skills/*" = "agents/skills/*"
"~/.codex/AGENTS.md" = "agents/AGENTS.md"
