min_version = "2026.9.5"

[tools]
stylua = "2.5.2"
lua-language-server = "3.19.1"

[settings]
experimental = true
dotfiles.root = "."

[bootstrap.hooks.post-tools]
run = "mise exec -- playwright install chromium"

[tasks.format-lua]
run = "stylua --allow-hidden ."

[tasks.check-format-lua]
run = "stylua --allow-hidden --check ."

[tasks.lint-lua]
run = 'lua-language-server --check=. --configpath=.luarc.json --check_format=pretty --logpath="{{ xdg_cache_home }}/lua-language-server/dotfiles/log" --metapath="{{ xdg_cache_home }}/lua-language-server/dotfiles/meta"'

[dotfiles]
"~/.agents/AGENTS.md" = "agents/AGENTS.md"
"~/.agents/skills/*" = "agents/skills/*"
"~/.gitconfig" = "git/.gitconfig"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/mise/config.toml" = "mise/config.toml"
"~/.playwright/cli.config.json" = "playwright/cli.config.json"
"~/.claude/CLAUDE.md" = "claude/CLAUDE.md"
"~/.claude/skills/*" = "claude/skills/*"
"~/.codex/AGENTS.md" = "codex/AGENTS.md"
