name: Lua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.14"
      - name: Format
        run: mise run check-format-lua
      - name: Lint
        run: mise run lint-lua
