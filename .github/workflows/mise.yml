name: Mise

on:
  push:
    branches: [main]
    paths:
      - mise.toml
      - mise/config.toml
      - mise.linux.toml
      - .github/workflows/mise.yml
  pull_request:
    paths:
      - mise.toml
      - mise/config.toml
      - mise.linux.toml
      - .github/workflows/mise.yml

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@v5
        with:
          version: "2026.9.16"
          install: true
          cache_key_prefix: mise-install-v1
