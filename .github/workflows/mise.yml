# This workflow is managed by gh actions-lock.

name: Mise

on:
  push:
    branches: [main]
    paths:
      - mise.toml
      - mise/config.toml
      - mise.linux.toml
      - .github/workflows/mise.yml
      - .github/workflows/actions.lock
  pull_request:
    paths:
      - mise.toml
      - mise/config.toml
      - mise.linux.toml
      - .github/workflows/mise.yml
      - .github/workflows/actions.lock

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # mise-action only restores an exact key, so every tool update reinstalled everything.
      # Restore the latest main cache instead and install only what changed.
      - name: Set cache key
        id: cache-key
        run: echo "prefix=mise-install-v2-$ImageOS-$RUNNER_ARCH-" >> "$GITHUB_OUTPUT"
      - name: Restore tools
        id: restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.local/share/mise
          key: ${{ steps.cache-key.outputs.prefix }}${{ hashFiles('mise.toml', 'mise/config.toml', 'mise.linux.toml', '.github/workflows/mise.yml') }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      # Windows has no source build fallback, so fail here when a Python
      # update has no precompiled build yet instead of compiling it on Linux.
      - name: Install tools
        uses: jdx/mise-action@v5.1.1
        env:
          MISE_PYTHON_COMPILE: "false"
        with:
          version: "2026.10.1"
          install: true
          cache: false
      # A PR's cache is visible only to that PR, so save from main only.
      - name: Remove old tool versions
        if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        run: mise prune --tools --yes
      - name: Save tools
        if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.local/share/mise
          key: ${{ steps.restore.outputs.cache-primary-key }}
